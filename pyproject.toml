[project]
name = "canela"
version = "0.2.0"
description = "Private Security System for the Homestead"
authors = [{ name = "mariofix", email = "yo@mariofix.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "dynaconf (>=3.2.0,<4.0.0)",
    "numpy (>=1.26,<3.0)",
    "blinker (>=1.7,<2.0)",
]

[tool.poetry]
packages = [{ include = "canela", from = "src" }]

[project.scripts]
motion = "canela.cli:main"

[tool.black]
line-length = 119
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 119
known_first_party = ["firenze"]

[tool.flake8]
max-line-length = 119
extend-ignore = ["E203", "W503"]                   # black-compatible
exclude = [".git", "__pycache__", "build", "dist"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "isort (>=9.0.1,<10.0.0)",
]
