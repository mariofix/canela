[tool.poetry]
name = "canela"
version = "0.1.0"
description = "Private Security System for the Homestead"
authors = ["canela contributors"]
readme = "README.md"
packages = [{ include = "canela", from = "src" }]

[tool.poetry.scripts]
canela = "canela.cli:main"

[tool.poetry.dependencies]
python = "^3.14"
dynaconf = "^3.2.11"
numpy = "^2.3.2"
opencv-python-headless = "^4.12.0.88"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^1.1.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
